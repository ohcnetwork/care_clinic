server {
  listen 80;
  root /usr/share/nginx/html;

  # Same hardening as CARE's own nginx.conf.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

  include mime.types;
  types {
    text/javascript js mjs;
  }

  # The bundle is refilled with the clinic's settings at every start without
  # changing file names, so browsers must revalidate instead of caching for
  # days as CARE's default configuration does. ETags keep this cheap.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
